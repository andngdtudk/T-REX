name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Only the lightweight deps needed to lint/test -- NOT torch/tensorflow/
          # pfrl/eclipse-sumo, which are unnecessary for this repo's unit tests
          # (see tests/README.md) and would make CI slow and flaky to install.
          pip install pytest ruff black isort numpy

      - name: Lint (ruff) -- advisory only for now
        # The codebase predates this CI workflow and has not yet had a full
        # ruff/black/isort pass applied (see AUDIT_REPORT.md Section 1.4) --
        # reformatting ~3,500 lines of scientifically load-bearing simulation
        # code is deliberately left for its own reviewed follow-up PR rather
        # than bundled silently into this one. Non-blocking until that lands.
        run: ruff check . || true

      - name: Check formatting (black) -- advisory only for now
        run: black --check . || true

      - name: Check import order (isort) -- advisory only for now
        run: isort --check . || true

      - name: Run tests
        run: python -m pytest tests/ -v
